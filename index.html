<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f0f4f8, #dfe9f3);
    }

    .calculator {
      width: 320px;
      background: #1f2937;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    .display {
      width: 100%;
      height: 70px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 2rem;
      text-align: right;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      height: 60px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
      background: #374151;
      color: #f9fafb;
    }

    button:hover {
      opacity: 0.95;
    }

    button:active {
      transform: scale(0.98);
    }

    .operator {
      background: #f59e0b;
      color: #111827;
      font-weight: bold;
    }

    .clear {
      background: #ef4444;
      color: white;
    }

    .equal {
      background: #10b981;
      color: white;
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input class="display" id="display" type="text" readonly />

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="appendValue('/')">/</button>
      <button onclick="appendValue('*')">×</button>
      <button class="operator" onclick="appendValue('-')">-</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button onclick="calculateResult()">=</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('.')">.</button>

      <button onclick="appendValue('0')" style="grid-column: span 3;">0</button>
      <button class="clear" onclick="deleteLast()">DEL</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = '';
    }

    function deleteLast() {
      display.value = display.value.slice(0, -1);
    }

    function calculateResult() {
      try {
        const expression = display.value;
        const result = Function(`"use strict"; return (${expression});`)();
        display.value = Number.isFinite(result) ? result : 'Error';
      } catch {
        display.value = 'Error';
      }
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key;

      if (/[0-9+\-*/.]/.test(key)) {
        appendValue(key);
      } else if (key === 'Enter' || key === '=') {
        calculateResult();
      } else if (key === 'Backspace') {
        deleteLast();
      } else if (key === 'Escape') {
        clearDisplay();
      }
    });
  </script>
</body>
</html>
